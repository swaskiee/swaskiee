<svg width="500" height="650" viewBox="0 0 500 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="revealClip">
      <rect x="0" y="650" width="500" height="0">
        <animate attributeName="y" from="650" to="0" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
        <animate attributeName="height" from="0" to="650" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
    <linearGradient id="lineGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image href="https://raw.githubusercontent.com/swaskiee/swaskiee/main/myphoto.png" x="0" y="0" width="500" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#revealClip)"/>
  <rect x="0" y="650" width="500" height="5" fill="url(#lineGlow)">
    <animate attributeName="y" from="650" to="0" dur="2.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
</svg>
